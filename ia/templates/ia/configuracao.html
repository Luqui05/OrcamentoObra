{% extends "ia/base.html" %}
{% load crispy_forms_tags %}

{% block ia_content %}
<div class="row g-4">
    <div class="col-lg-7">
        <div class="card">
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <button type="submit" class="btn btn-primary">Salvar configuração</button>
                </form>
            </div>
        </div>
    </div>
    <div class="col-lg-5">
        <section class="card" aria-labelledby="teste-ia-titulo">
            <div class="card-body">
                <h2 class="h5" id="teste-ia-titulo">Conexão com o provedor</h2>
                <p class="text-muted">O teste usa a configuração salva. A chamada consome tokens da sua cota e aparece em Requisições.</p>
                <form method="post" action="{% url 'ia:testar_conexao' %}">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-outline-primary" {% if not configuracao_salva %}disabled{% endif %}>
                        Testar conexão
                    </button>
                </form>
            </div>
        </section>
    </div>
</div>
{% endblock %}
