{% extends "ia/base.html" %}
{% load crispy_forms_tags %}

{% block ia_content %}
<div class="card">
    <div class="card-body">
        <h2 class="h5 mb-3">{{ object.usuario.get_username }}</h2>
        <form method="post">
            {% csrf_token %}
            {{ form|crispy }}
            <button type="submit" class="btn btn-primary">Salvar acesso</button>
            <a href="{% url 'ia:ia_por_usuario' %}" class="btn btn-outline-secondary">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
